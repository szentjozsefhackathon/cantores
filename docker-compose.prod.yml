name: creshu-prod

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - path: ./.env.prod
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.asDefault=true
      # Cloudflare terminates the public TLS; what Traefik presents is the
      # Cloudflare Origin CA certificate, which only Cloudflare trusts. That is
      # what lets the zone run SSL mode "Full (strict)": Cloudflare verifies it
      # is talking to this server rather than merely encrypting to whatever
      # answers on the IP. The certificate is loaded as the default of the
      # default TLS store (see `configs` at the bottom), so every router on
      # websecure gets it without naming it.
      #
      # The PEM and key live in ./certs on the server and nowhere else — not in
      # the repository, not in the image. Create them under SSL/TLS → Origin
      # Server in the Cloudflare dashboard for cantores.hu and *.cantores.hu.
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/etc/traefik/tls.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    configs:
      - source: traefik_tls
        target: /etc/traefik/tls.yml
    networks:
      - traefik
  migrator:
    image: creshu-app-prod
    user: "33:33" # www-data
    mem_limit: 256m
    env_file:
      - path: ./.env.prod
        required: false
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    entrypoint: []
    # db:seed re-runs RolePermissionSeeder, SystemAdminSeeder and GenreSeeder on
    # every deploy. They're all written to be safe to repeat (firstOrCreate,
    # additive givePermissionTo), so this is how a newly added permission or role
    # grant actually reaches production instead of sitting unseeded until someone
    # runs it by hand.
    #
    # package:discover comes first because bootstrap/cache is a named volume, and
    # Docker only seeds a named volume from the image when it is first created.
    # Without it the packages.php from whichever deploy created the volume
    # survives every later image, and a newly added package's service provider is
    # never registered — which is how laravel/octane's commands went missing.
    command: ["/bin/sh", "-c", "php artisan package:discover && php artisan migrate -n --force && php artisan db:seed --force && php artisan icons:clear && php artisan icons:cache && php artisan view:clear && php artisan optimize"]
    restart: "no"
  app:
    image: creshu-app-prod
    restart: unless-stopped
    # OCTANE_WORKERS in .env.prod is sized against this number and not against
    # the host's CPU count, which is what FrankenPHP would otherwise guess from:
    # eight workers, each holding a booted Laravel, is the starting point, and
    # the measurement that should replace the guess is a worker's resident size
    # once the site has been warm for an hour. The Dockerfile's CMD carries the
    # same default for a deploy whose .env.prod predates Octane.
    mem_limit: 1024m
    # www-data, as the Apache children were. Apache ran a root master that forked
    # unprivileged workers; FrankenPHP is one process, so the whole server drops
    # instead — which is why it listens on 8000 rather than 80 and why the
    # Traefik label below names that port.
    user: "33:33"
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-}
      # Passed as a BuildKit secret, not a build arg: arg values are recorded in
      # the image's layer history and readable via `docker history`.
      secrets:
        - github_token
    # Use this when building: GIT_COMMIT_HASH=$(git rev-parse HEAD) docker compose ...
    env_file:
      - path: ./.env.prod # write your customizations here - these are used as environment variables, not from the file inside the container
        required: false
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
      - ./import:/var/www/html/import
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=creshu-prod_traefik
      - traefik.http.routers.myapp.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.services.myapp.loadbalancer.server.port=8000
      - traefik.http.middlewares.mywwwredirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.mywwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.routers.myapp.middlewares=mywwwredirect,hsts,compress
      - traefik.http.routers.myapp.priority=10
      - traefik.http.middlewares.compress.compress=true
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hsts.headers.stsPreload=true      
    networks:
      - traefik
      - internal
    # /up is Laravel's own health route (bootstrap/app.php), so a pass means a
    # worker booted the framework and answered — not merely that a port is open,
    # which is the distinction that matters now that starting the container and
    # being able to serve a request are two different moments.
    #
    # This drives `docker compose ps`, `depends_on: service_healthy` and the
    # verification step of deploy-prod.sh. It does *not* drive Traefik, which
    # ignores Docker healthchecks and would need its own
    # loadbalancer.healthcheck labels; with a single replica there is nothing for
    # it to fail over to, so it is not worth the second mechanism.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Long enough for in-flight requests to finish before the workers are killed.
    # The default is 10s and a score export can outlast it.
    stop_grace_period: 30s
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 1280m
    env_file:
      - ./.env.prod # for the database credentials
    networks:
      - internal
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantor -d cantores"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 3      
  redis:
    # Where sessions live, and nowhere else for now — the cache is still
    # memcached's, and moving it is a separate decision.
    #
    # Redis rather than memcached for exactly one reason, which is the whole
    # reason this container exists: it survives its own restart. A session store
    # that forgets on restart signs every church laptop out, and the laptop is
    # across the building from the person holding the phone. Appending rather
    # than snapshotting, and fsyncing once a second, so a hard stop costs at most
    # the last second of sessions instead of the last several minutes; the RDB
    # snapshots are turned off outright rather than kept as a second mechanism
    # doing the same job worse.
    #
    # `volatile-lru` over `noeviction` deliberately. Everything written here
    # carries a TTL, so under memory pressure Redis drops the sessions nobody has
    # touched for longest — which is somebody signing in again — rather than
    # refusing writes, which is the whole site returning 500s.
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 192m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  memcached:
    image: memcached:1.6
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --memory-limit=224
    networks:
      - internal
  queue:
    image: creshu-app-prod
    user: "33:33" # www-data
    mem_limit: 256m
    env_file:
      - path: ./.env.prod
        required: false
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - internal
    entrypoint: []
    command: ["/bin/sh", "-c", "php artisan queue:work --sleep=15 --tries=3 --timeout=3600"]
    restart: unless-stopped
    # The FrankenPHP base image ships a HEALTHCHECK that polls Caddy's admin port,
    # and this container never starts Caddy, so it would only ever report unhealthy.
    healthcheck:
      disable: true
  musescore:
    # Uploaded score files are attacker-controlled input parsed by MuseScore's Qt
    # stack, so this worker is kept away from anything it does not need: its own
    # queue, the internal network only, non-root, and hard memory and process
    # caps. /tmp is tmpfs so the plaintext the renderer needs never lands on the
    # storage volume the encryption at rest is protecting.
    image: creshu-musescore-prod
    user: "33:33" # www-data
    mem_limit: 1g
    pids_limit: 256
    env_file:
      - path: ./.env.prod
        required: false
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - internal
    entrypoint: []
    command: ["/bin/sh", "-c", "php artisan queue:work --queue=musescore --sleep=15 --tries=2 --timeout=600"]
    restart: unless-stopped
    # The FrankenPHP base image ships a HEALTHCHECK that polls Caddy's admin port,
    # and this container never starts Caddy, so it would only ever report unhealthy.
    healthcheck:
      disable: true
  scheduler:
    image: creshu-app-prod
    user: "33:33" # www-data
    mem_limit: 256m
    env_file:
      - path: ./.env.prod
        required: false
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - internal
    entrypoint: []
    command: ["/bin/sh", "-c", "php artisan schedule:work"]
    restart: unless-stopped
    # The FrankenPHP base image ships a HEALTHCHECK that polls Caddy's admin port,
    # and this container never starts Caddy, so it would only ever report unhealthy.
    healthcheck:
      disable: true
  maintenance:
    image: nginx:alpine
    mem_limit: 32m
    volumes:
      - ./docker/maintenance:/usr/share/nginx/html:ro
      - ./docker/maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.maintenance.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.maintenance.priority=1
      - traefik.http.services.maintenance.loadbalancer.server.port=80
    restart: unless-stopped

configs:
  traefik_tls:
    content: |
      tls:
        stores:
          default:
            defaultCertificate:
              certFile: /certs/origin.pem
              keyFile: /certs/origin.key

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  db-data:
  redis-data:
  storage:
  cache:
networks:
  traefik:
  internal:
