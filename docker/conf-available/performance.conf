# How much of this container Apache is allowed to become.
#
# The image is php:8.4-apache, which is mod_php on mpm_prefork: one process per
# request in flight, each of them a whole PHP. Debian ships MaxRequestWorkers
# 150, and docker-compose.prod.yml gives this container a gigabyte — so the
# shipped ceiling is one the container cannot pay for. Left alone, a burst of
# traffic is not answered slowly, it is answered until the kernel kills Apache,
# and on a Sunday morning that takes every projection in the country down at
# once rather than making any of them wait.
#
# So the ceiling is moved to where the memory actually is. Sixteen mod_php
# children at the 40-70 MB each this application runs to leaves room for the
# parent and for the memory_limit headroom of the one or two requests doing
# something large. Past sixteen, requests queue in the listen backlog and are
# answered late, which is what "under load" is supposed to feel like.
#
# For scale: the projection poll is two requests a second per cantor, and each
# is a handful of indexed reads. A hundred parishes at once is around four
# workers busy. Sixteen is four times that, and the point of the number is not
# the throughput but the ceiling underneath it.
<IfModule mpm_prefork_module>
    ServerLimit          16
    MaxRequestWorkers    16
    StartServers         4
    MinSpareServers      4
    MaxSpareServers      8

    # Recycle children rather than letting a fortnight of uptime accumulate in
    # them. Nothing here is stateful — every request boots its own Laravel.
    MaxConnectionsPerChild 1000
</IfModule>

# Traefik is the only client, over the internal docker network, and every
# keep-alive second it holds is a prefork child it holds with it. Short enough
# that an idle pooled connection frees its worker quickly; long enough that a
# page and its assets still travel down one connection.
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 200
