<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Chord Accidentals draws the ♯ ♭ ♮ abc2svg writes into a chord symbol, after
    the lyric face in a bold chord font. It has one weight, and in the browser
    its @font-face answers every weight as it is; fontconfig would otherwise
    thicken it to fake the bold the chord asks for, and the server-side PDF
    would draw the accidentals heavier than the screen does.
  -->
  <match target="font">
    <test name="family">
      <string>Chord Accidentals</string>
    </test>
    <edit name="embolden" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
</fontconfig>
