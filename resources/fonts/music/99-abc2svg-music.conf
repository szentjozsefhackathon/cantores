<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    abc2svg renders music notation (clefs, noteheads, accidentals, tempo
    glyphs, ...) as SVG <text>/<tspan> elements in font-family "music". In the
    browser that family is provided by an @font-face embedded in the SVG, but
    librsvg/rsvg-convert ignores embedded @font-face fonts and resolves all
    text through fontconfig. Map the requested "music" family onto the
    abc2svg.ttf notation font (internal family name "abc2svg") so the glyphs
    render during server-side PDF export instead of falling back to a text font.
  -->
  <match target="pattern">
    <test name="family">
      <string>music</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>abc2svg</string>
    </edit>
  </match>
</fontconfig>
