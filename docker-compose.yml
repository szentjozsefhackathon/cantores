---
services:
  app_dev_prepopulate:
    image: creshu-app-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    env_file:
      - path: ./.env.docker
        required: false
    volumes:
      - .:/var/www/html
    command: touch .devcontainer/.bash_history
    deploy:
      resources:
        limits:
          memory: 128M
  app:
    image: creshu-app-dev
    env_file:
      - path: ./.env.docker
        required: false
    volumes:
      - .:/var/www/html
      - .devcontainer/.bash_history:/home/laravel/.bash_history
      - .devcontainer/.ssh:/home/laravel/.ssh
      - claude-home:/home/laravel/.claude
      - xdebug-profiles:/tmp/xdebug-profiles
    networks:
      - creshu-network
    ports:
      - "${APP_EXTERNAL_PORT:-8080}:80"
      - "${VITE_EXTERNAL_PORT:-5173}:${VITE_EXTERNAL_PORT:-5173}"
    depends_on:
      app_dev_prepopulate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
  database:
    image: pgvector/pgvector:pg17
    env_file:
      - ./.env # for the database credentials
      - path: ./.env.docker
        required: false
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    networks:
      - creshu-network
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE} -p 5432"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M      
  database_testing:
    image: pgvector/pgvector:pg17
    env_file:
      - ./.env.testing # for the database credentials
      - path: ./.env.docker
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - creshu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db-testing-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
  composer:
    image: creshu-app-dev
    env_file:
      - path: ./.env.docker
        required: false
    environment:
      - XDEBUG_CONFIG="mode=off"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    command: bash -c "source $$NVM_DIR/nvm.sh && npm install && npm run build && composer install --no-interaction"
    deploy:
      resources:
        limits:
          memory: 512M
  migrator:
    image: creshu-app-dev
    env_file:
      - path: ./.env.docker
        required: false
    environment:
      - XDEBUG_CONFIG="mode=off"
    volumes:
      - .:/var/www/html
    command: php artisan migrate -n
    depends_on:
      database:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
    networks:
      - creshu-network
    deploy:
      resources:
        limits:
          memory: 256M
  migrator_testing:
     image: creshu-app-dev
     env_file:
       - path: ./.env.docker
         required: false
     environment:
       - XDEBUG_CONFIG="mode=off"
     volumes:
       - .:/var/www/html
     depends_on:
       database_testing:
         condition: service_healthy
       composer:
         condition: service_completed_successfully
     networks:
       - creshu-network
     command: php artisan migrate:refresh --seed --seeder="Database\\Seeders\\DatabaseSeeder" --env=testing
     deploy:
       resources:
         limits:
           memory: 256M
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_WEBUI_PORT:-8025}:8025" # Web UI (optional, defaults to 8025)
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (optional, defaults to 1025)
    networks:
      - creshu-network
    deploy:
      resources:
        limits:
          memory: 64M
  memcached:
    image: memcached:1.6
    command:
      - --memory-limit=32
    networks:
      - creshu-network    
  webgrind:
    image: jokkedk/webgrind:latest
    ports:
      - "${WEBGRIND_EXTERNAL_PORT:-8281}:80"
    volumes:
      - xdebug-profiles:/tmp
    networks:
      - creshu-network
    deploy:
      resources:
        limits:
          memory: 64M
  queue:
    image: creshu-app-dev
    env_file:
      - path: ./.env.docker
        required: false
    environment:
      - XDEBUG_CONFIG="mode=off"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - creshu-network
    command: php artisan queue:work --sleep=15 --tries=3 --timeout=3600
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
  musescore:
    # Build with:
    #   docker build -f Dockerfile.musescore --build-arg BASE_IMAGE=creshu-app-dev \
    #     --build-arg BASE_USER=laravel -t creshu-musescore-dev .
    image: creshu-musescore-dev
    env_file:
      - path: ./.env.docker
        required: false
    environment:
      - XDEBUG_CONFIG="mode=off"
    volumes:
      - .:/var/www/html
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - creshu-network
    command: php artisan queue:work --queue=musescore --sleep=15 --tries=2 --timeout=600
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  db-data:
  db-testing-data:
  qdrant_storage:
  xdebug-profiles:
  claude-home:  
networks:
  creshu-network:
